<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Meeting · AI Meeting Assistant</title>
<link rel="stylesheet" href="assets/css/app.css?v=23">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='19'>🎙️</text></svg>">
</head>
<body>

<header class="appbar" id="appbar"></header>

<main class="page">
  <div class="container stack" style="gap:20px">

    <a class="faint row" href="meetings.html" style="gap:6px;width:max-content" id="backLink">Back to meetings</a>

    <div class="row row--between reveal" style="align-items:flex-start">
      <div class="grow">
        <h1 id="title" style="font-size:clamp(1.5rem,1.1rem+1.6vw,2.2rem)">
          <span class="skeleton skeleton--title" style="display:block"></span>
        </h1>
        <div class="row faint" style="gap:10px;margin-top:6px">
          <span id="date"></span>
          <span id="ownerBadge"></span>
        </div>
      </div>
      <div class="row">
        <button class="btn btn--sm hidden" id="addParticipantBtn" type="button">Add participant</button>
        <button class="btn btn--sm btn--danger hidden" id="deleteBtn" type="button">Delete</button>
      </div>
    </div>

    <div class="detail-grid">

      <section class="card reveal">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" id="tab-summary"    aria-selected="true"  data-panel="panel-summary">Summary</button>
          <button class="tab" role="tab" id="tab-transcript" aria-selected="false" data-panel="panel-transcript">Transcript</button>
          <button class="tab" role="tab" id="tab-chat" aria-selected="false" data-panel="panel-chat">Ask AI</button>
        </div>

        <div id="panel-summary" role="tabpanel" aria-labelledby="tab-summary">
          <div class="prose" id="summary">
            <div class="skeleton skeleton--text"></div>
            <div class="skeleton skeleton--text" style="width:88%"></div>
            <div class="skeleton skeleton--text" style="width:72%"></div>
          </div>
          <div class="row" style="margin-top:14px">
            <button class="btn btn--sm btn--ghost" id="copySummary" type="button">Copy summary</button>
          </div>
        </div>

        <div id="panel-transcript" role="tabpanel" aria-labelledby="tab-transcript" hidden>
          <div class="prose" id="transcript"></div>

          <div class="transcribe-bar hidden" id="transcribeBar">
            <div class="grow">
              <div style="font-weight:650" id="transcribeTitle">Not transcribed yet</div>
              <div class="faint" id="transcribeHint">Run the speech-to-text model on this recording.</div>
            </div>
            <button class="btn btn--primary" id="transcribeBtn" type="button">Transcribe</button>
          </div>

          <div class="row" style="margin-top:14px">
            <button class="btn btn--sm btn--ghost" id="copyTranscript" type="button">Copy transcript</button>
            <button class="btn btn--sm btn--ghost" id="downloadTranscript" type="button">Download .txt</button>
          </div>
        </div>

        <div id="panel-chat" role="tabpanel" aria-labelledby="tab-chat" hidden>
          <div class="chat">
            <div class="chat__log" id="chatLog" aria-live="polite">
              <div class="skeleton skeleton--text"></div>
              <div class="skeleton skeleton--text" style="width:70%"></div>
            </div>

            <div class="chat__suggest" id="chatSuggest" hidden>
              <button class="chip" type="button">Summarise the key decisions</button>
              <button class="chip" type="button">What are the action items?</button>
              <button class="chip" type="button">Who attended and what did they say?</button>
            </div>

            <form class="chat__composer" id="chatForm">
              <textarea class="input chat__input" id="chatInput" rows="1"
                        placeholder="Ask anything about this meeting…"
                        aria-label="Ask a question about this meeting"></textarea>
              <button class="btn btn--primary btn--icon chat__send" id="chatSend"
                      type="submit" aria-label="Send question"></button>
            </form>
            <p class="faint chat__hint">Enter to send · Shift+Enter for a new line</p>
          </div>
        </div>
      </section>

      <aside class="stack detail-grid__side reveal">
        <div class="panel stack">
          <div class="card__head" style="margin:0"><h3>Audio</h3></div>
          <audio id="audio" controls preload="none" class="hidden"></audio>
          <p class="faint" id="audioStatus">Loading audio…</p>
        </div>

        <div class="panel stack hidden" id="participantBox">
          <div class="card__head" style="margin:0"><h3>Add participant</h3></div>
          <div class="field">
            <label class="label sr-only" for="participantEmail">Search by email</label>
            <div class="row" style="gap:8px;flex-wrap:nowrap">
              <input class="input grow" id="participantEmail" type="email" placeholder="teammate@company.com">
              <button class="btn btn--icon btn--primary" id="searchUserBtn" type="button" aria-label="Search"></button>
            </div>
          </div>
          <div class="stack-sm" id="userResults"></div>
        </div>
      </aside>

    </div>
  </div>
</main>

<script type="module">
import { $, $$, api, icon, toast, busy, requireAuth, mountAppBar, confirmDialog,
         formatDate, relativeTime, escapeHtml, initials, Tokens, CONFIG,
         trackTranscription, notifyTranscription } from './assets/js/app.js?v=23';

if (requireAuth()) {
  mountAppBar({ active: 'meetings' });

  const meetingId = new URLSearchParams(location.search).get('id');
  if (!meetingId) location.replace('meetings.html');

  $('#backLink').insertAdjacentHTML('afterbegin', icon('chevron', 15).replace('<svg', '<svg style="transform:rotate(180deg)"'));
  $('#deleteBtn').insertAdjacentHTML('afterbegin', icon('trash', 16));
  $('#addParticipantBtn').insertAdjacentHTML('afterbegin', icon('users', 16));
  $('#searchUserBtn').innerHTML = icon('search', 18);

  /* ---------- tabs ---------- */
  const tabs = $$('.tab');
  tabs.forEach(t => t.onclick = () => {
    tabs.forEach(o => {
      const on = o === t;
      o.setAttribute('aria-selected', on);
      $('#' + o.dataset.panel).hidden = !on;
    });
  });

  const copy = async (text, label) => {
    try { await navigator.clipboard.writeText(text); toast(`${label} copied`, 'ok', 1800); }
    catch { toast('Copy failed', 'error'); }
  };

  let meeting = null;
  let transcript = '';
  let transcriptRaw = '';

  /* ============================================================
     TRANSCRIPTION STATE MACHINE
     ------------------------------------------------------------
     The DB `status` column is the single source of truth, so the
     correct UI is restored on reload / in another tab.

       idle       -> no transcript, button enabled
       processing -> job running, button locked + spinner, poll
       done       -> transcript present, button locked "Transcribed"
       failed     -> error shown, button re-enabled as "Try again"
     ============================================================ */
  const tBar   = $('#transcribeBar');
  const tBtn   = $('#transcribeBtn');
  const tTitle = $('#transcribeTitle');
  const tHint  = $('#transcribeHint');

  const STATE = { IDLE: 'idle', PROCESSING: 'processing', DONE: 'done', FAILED: 'failed' };
  let state = STATE.IDLE;

  /* ---- local "job in flight" marker -------------------------------------
     Backup for the case where the backend does not (yet) expose a status
     field. Written when the user starts a job, cleared on a terminal state.
     Lets us restore the loading UI when the user navigates away and returns.
     Expires so a crashed server can never lock the button forever.        */
  const FLAG = `transcribing:${meetingId}`;
  const FLAG_TTL = 60 * 60 * 1000;                       // 1 hour

  const markStarted = () => {
    try { localStorage.setItem(FLAG, String(Date.now())); } catch {}
  };
  const clearStarted = () => {
    try { localStorage.removeItem(FLAG); } catch {}
  };
  const startedLocally = () => {
    try {
      const t = Number(localStorage.getItem(FLAG));
      if (!t) return false;
      if (Date.now() - t > FLAG_TTL) { clearStarted(); return false; }
      return true;
    } catch { return false; }
  };
  let pollTimer = null;
  let pollStarted = 0;
  let pollDelay = 3000;                    // backs off to 15s on long jobs
  const POLL_CEILING = 60 * 60 * 1000;     // stop polling after 1h

  /** Map whatever the backend reports onto our state machine.
   *  Returns null when the payload carries NO recognisable signal, so the
   *  caller can decide (we never downgrade a running job on silence). */
  function deriveState(m) {
    const raw = String(m?.status ?? m?.transcription_status ?? m?.state ?? '').toLowerCase().trim();
    const text = (typeof m?.transcripts === 'string' ? m.transcripts : m?.transcript) || '';

    if (['processing', 'pending', 'queued', 'running', 'in_progress', 'inprogress',
         'transcribing', 'started', 'busy', 'working'].includes(raw)) return STATE.PROCESSING;
    if (['failed', 'error', 'failure', 'cancelled', 'canceled'].includes(raw)) return STATE.FAILED;
    if (text.trim()) return STATE.DONE;                 // real text always wins
    if (['done', 'completed', 'complete', 'success', 'succeeded', 'finished', 'ready']
        .includes(raw)) return STATE.DONE;
    if (raw) return null;      // unknown status string -> no opinion
    return STATE.IDLE;         // genuinely empty row
  }

  const SKELETON =
    `<div class="skeleton skeleton--text"></div>
     <div class="skeleton skeleton--text" style="width:92%"></div>
     <div class="skeleton skeleton--text" style="width:78%"></div>
     <div class="skeleton skeleton--text" style="width:85%"></div>`;

  /* Strip diarisation metadata so the panel shows prose, not machine output.
     Handles lines like:
       [3.29 -> 11.81] SPEAKER_00:  text
       [00:03.29 --> 00:11.81] SPEAKER_00: text
       (3.29 - 11.81) Speaker 1: text
       SPEAKER_00: text
     Consecutive lines from the same speaker are merged into one paragraph. */
  function cleanTranscript(raw) {
    const src = String(raw || '').replace(/\r/g, '');
    if (!src.trim()) return '';

    const TIME = /^\s*[\[(<]?\s*\d{1,2}(?::\d{2}){0,2}(?:[.,]\d+)?\s*(?:-{1,2}>?|–|—|to)\s*\d{1,2}(?::\d{2}){0,2}(?:[.,]\d+)?\s*[\])>]?\s*/i;
    const SPEAKER = /^\s*(?:speaker[\s_-]*\w+|spk[\s_-]*\w+|s\d+)\s*[:\-–]\s*/i;

    const out = [];
    let touched = false;

    for (const line of src.split('\n')) {
      let t = line;
      if (TIME.test(t))    { t = t.replace(TIME, '');    touched = true; }
      if (SPEAKER.test(t)) { t = t.replace(SPEAKER, ''); touched = true; }
      t = t.trim();
      if (t) out.push(t);
    }

    // Nothing matched -> leave the original untouched.
    if (!touched) return src.trim();
    return out.join(' ').replace(/\s{2,}/g, ' ').trim();
  }

  /** Single render function — every state change goes through here. */
  function render(next, { text = null, error = null } = {}) {
    state = next;
    if (text !== null) {
      transcriptRaw = String(text || '').trim();
      transcript = cleanTranscript(transcriptRaw);
    }

    // Keep the local marker in sync with the machine.
    // NOTE: we deliberately do NOT clear it on done/failed here. The global
    // watcher (app.js) owns that: it needs the marker to survive until it has
    // observed the completion, otherwise the notification + sound never fire.
    // Only 'idle' (no job was ever started) releases it.
    if (next === STATE.PROCESSING) markStarted();
    else if (next === STATE.IDLE) clearStarted();

    const done = next === STATE.DONE;
    const processing = next === STATE.PROCESSING;

    // --- transcript body ---
    $('#transcript').innerHTML =
      processing ? SKELETON
      : done      ? escapeHtml(transcript)
      : next === STATE.FAILED
        ? `<span class="muted">Transcription failed. You can try again below.</span>`
        : `<span class="muted">No transcript yet. Use the button below to generate one.</span>`;

    // --- action row ---
    $('#copyTranscript').disabled = !done;
    $('#downloadTranscript').disabled = !done;

    // --- the bar ---
    tBar.classList.remove('hidden');
    tBar.classList.toggle('is-running', processing);
    tBar.classList.toggle('is-done', done);
    tBar.classList.toggle('is-failed', next === STATE.FAILED);

    // --- the button: locked in BOTH processing and done ---
    busy(tBtn, processing);                 // spinner while the job runs
    tBtn.disabled = processing || done;     // busy() toggles disabled, so set it after
    tBtn.setAttribute('aria-disabled', String(tBtn.disabled));
    tBar.setAttribute('aria-busy', String(processing));

    if (processing) {
      tTitle.textContent = 'Transcribing…';
      tHint.textContent  = 'The model is running on the server. This can take a few minutes — you can safely leave this page.';
      tBtn.title = 'Transcription already in progress';
      // label is hidden by the spinner, but keep it correct for screen readers
      tBtn.innerHTML = `${icon('sparkle', 17)} Transcribing…`;
    } else if (done) {
      const words = transcript ? transcript.split(/\s+/).length.toLocaleString() : '0';
      tTitle.textContent = 'Transcript ready';
      tHint.textContent  = `${words} words.`;
      tBtn.title = 'This meeting already has a transcript';
      tBtn.innerHTML = `${icon('check', 17)} Transcribed`;
    } else if (next === STATE.FAILED) {
      tTitle.textContent = 'Transcription failed';
      tHint.textContent  = error || 'Something went wrong on the server.';
      tBtn.title = 'Run the transcription again';
      tBtn.innerHTML = `${icon('sparkle', 17)} Try again`;
    } else {
      tTitle.textContent = 'Not transcribed yet';
      tHint.textContent  = 'Run the speech-to-text model on this recording.';
      tBtn.title = 'Run speech-to-text on this recording';
      tBtn.innerHTML = `${icon('sparkle', 17)} Transcribe`;
    }
  }

  /* ---------- polling while status === processing ---------- */
  function stopPolling() { clearTimeout(pollTimer); pollTimer = null; }

  function startPolling() {
    if (pollTimer) return;                 // already polling
    pollStarted = Date.now();
    pollDelay = 3000;
    queuePoll();
  }

  function queuePoll() {
    stopPolling();
    pollTimer = setTimeout(poll, pollDelay);
  }

  async function poll() {
    // Don't hammer the API in a hidden tab; resume on focus.
    if (document.hidden) { queuePoll(); return; }

    if (Date.now() - pollStarted > POLL_CEILING) {
      stopPolling();
      render(STATE.FAILED, { error: 'Still processing after an hour — check the server logs.' });
      return;
    }

    try {
      const fresh = await api(`/meetings/${encodeURIComponent(meetingId)}`, { cache: 'no-store' });
      meeting = fresh;
      const next = deriveState(fresh);

      /* STICKY RULE ------------------------------------------------------
         Once a job is running, ONLY an explicit terminal signal releases the
         lock: real transcript text, or a done/failed status. Anything else
         (idle, empty, unknown status, a backend with no status column yet)
         keeps the spinner up. This is what stops the button flicking back to
         enabled a few seconds after being pressed. */
      if (next !== STATE.DONE && next !== STATE.FAILED) {
        pollDelay = Math.min(pollDelay * 1.4, 15000);   // gentle backoff
        queuePoll();
        return;
      }

      stopPolling();
      /* This page polls faster than the global watcher, so it usually sees the
         completion first. Emit the notification here rather than waiting — and
         because notifyTranscription() is keyed by run, the watcher's later tick
         is de-duplicated and cannot double-chime. */
      const title = (meeting && meeting.title) || 'Meeting';
      if (next === STATE.DONE) {
        const t = (typeof fresh.transcripts === 'string' ? fresh.transcripts : fresh.transcript) || '';
        render(STATE.DONE, { text: t });
        notifyTranscription(meetingId, title, true);
      } else {
        render(STATE.FAILED, { error: fresh.error || fresh.detail || null });
        notifyTranscription(meetingId, title, false);
      }
    } catch (err) {
      if (err.status === 401) { stopPolling(); return; }
      pollDelay = Math.min(pollDelay * 2, 20000);       // network blip — back off and retry
      queuePoll();                                      // stays locked meanwhile
    }
  }

  // Poll immediately when the tab regains focus.
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && state === STATE.PROCESSING) { pollDelay = 2000; queuePoll(); }
  });
  window.addEventListener('beforeunload', stopPolling);

  /* ---------- click: fire the job, flip to processing ---------- */
  tBtn.onclick = async () => {
    if (state === STATE.PROCESSING || state === STATE.DONE) return;   // hard guard

    const prev = state;
    render(STATE.PROCESSING);              // optimistic: lock the button immediately
    trackTranscription(meetingId);         // tell the global watcher a job just started

    try {
      const res = await api(`/meetings/${encodeURIComponent(meetingId)}/transcribe`, { method: 'POST' });

      // If the endpoint blocks and returns the finished text, use it directly.
      const text = typeof res === 'string' ? res
                 : res?.transcripts ?? res?.transcript ?? res?.text ?? '';

      if (text && String(text).trim()) {
        render(STATE.DONE, { text });
        notifyTranscription(meetingId, (meeting && meeting.title) || 'Meeting', true);
        return;
      }

      // Otherwise the job was accepted and runs in the background → poll.
      // Only an explicit "failed" body cancels the lock; empty/unknown
      // responses mean "accepted, keep waiting".
      if (deriveState(res) === STATE.FAILED) {
        render(STATE.FAILED, { error: res?.error || res?.detail || null });
        return;
      }
      render(STATE.PROCESSING);
      startPolling();
    } catch (err) {
      if (err.status === 401) return;

      // 409 = server says a job is already running: stay locked and follow it.
      if (err.status === 409) {
        render(STATE.PROCESSING);
        startPolling();
        toast('Transcription is already in progress', 'info');
        return;
      }

      render(prev === STATE.DONE ? STATE.DONE : STATE.FAILED, { error: err.message });
      toast(err.message || 'Could not start transcription', 'error', 6000);
    }
  };

  /* ---------- load meeting ---------- */
  (async () => {
    try {
      meeting = await api(`/meetings/${encodeURIComponent(meetingId)}`);

      const title = meeting.title || 'Untitled meeting';
      document.title = `${title} · AI Meeting Assistant`;
      $('#title').textContent = title;
      $('#date').innerHTML = `${icon('clock', 14)} ${escapeHtml(formatDate(meeting.created_at))} · ${escapeHtml(relativeTime(meeting.created_at) || '')}`;
      $('#date').style.display = 'inline-flex';
      $('#date').style.gap = '6px';
      $('#date').style.alignItems = 'center';

      const summary = (meeting.summary || '').trim();

      $('#summary').innerHTML = summary
        ? escapeHtml(summary)
        : `<span class="muted">No summary yet — it appears once processing finishes.</span>`;

      // Restore the transcription state from the DB. If the server says
      // "processing" (e.g. the user reloaded mid-run, or started it in another
      // tab), the button comes back already locked and polling resumes.
      /* Restore the transcription UI on every fresh page load.
         The user may have started a job, navigated to Home, recorded another
         meeting, and come back — the correct state must be rebuilt from the
         server (or from the local marker if the API has no status field). */
      const initialText = (typeof meeting.transcripts === 'string' ? meeting.transcripts
                                                                   : meeting.transcript) || '';
      const reported = deriveState(meeting);          // may be null = "no opinion"

      let initial;
      if (reported === STATE.DONE || reported === STATE.FAILED) {
        initial = reported;                           // server is authoritative
      } else if (reported === STATE.PROCESSING) {
        initial = STATE.PROCESSING;                   // still running
      } else if (startedLocally()) {
        initial = STATE.PROCESSING;                   // we started one; API is quiet
      } else {
        initial = STATE.IDLE;
      }

      render(initial, { text: initialText, error: meeting.error || null });
      if (initial === STATE.PROCESSING) startPolling();

      $('#copySummary').disabled = !summary;
      $('#copySummary').onclick = () => copy(summary, 'Summary');
      $('#copyTranscript').onclick = () => copy(transcript, 'Transcript');
      $('#downloadTranscript').onclick = () => {
        const url = URL.createObjectURL(new Blob([transcript], { type: 'text/plain' }));
        const a = Object.assign(document.createElement('a'), { href: url, download: `${title}.txt` });
        a.click(); URL.revokeObjectURL(url);
      };

      if (meeting.is_owner) {
        $('#ownerBadge').outerHTML = `<span class="badge badge--brand">${icon('user', 13)} Owner</span>`;
        $('#addParticipantBtn').classList.remove('hidden');
        $('#deleteBtn').classList.remove('hidden');
      }
    } catch (err) {
      if (err.status === 401) return;
      $('#title').textContent = 'Meeting unavailable';
      $('#summary').innerHTML = `<span class="muted">${escapeHtml(err.message)}</span>`;
      toast(err.message || 'Could not load this meeting', 'error');
    }
  })();

  /* ============================================================
     RAG CHAT
       GET  /meetings/{id}/chat  -> { messages: [...] }  (newest first)
       POST /meetings/{id}/chat  -> { answer, sources: [{start,end}] }
     ============================================================ */
  const chatLog   = $('#chatLog');
  const chatForm  = $('#chatForm');
  const chatInput = $('#chatInput');
  const chatSend  = $('#chatSend');
  chatSend.innerHTML = icon('arrow', 18);

  let chatBusy = false;

  /* Arabic/Hebrew content must render right-to-left. */
  const isRTL = t => /[\u0591-\u07FF\uFB1D-\uFDFD\uFE70-\uFEFF]/.test(String(t || ''));
  const dirOf = t => (isRTL(t) ? 'rtl' : 'ltr');

  const mmss = s => {
    const n = Math.max(0, Math.floor(Number(s) || 0));
    return `${String(Math.floor(n / 60)).padStart(2, '0')}:${String(n % 60).padStart(2, '0')}`;
  };

  /** Merge overlapping/duplicate source ranges, then sort by start. */
  function tidySources(sources) {
    const list = (Array.isArray(sources) ? sources : [])
      .map(s => {
        const a = Number(s?.start) || 0, b = Number(s?.end) || 0;
        return { start: Math.min(a, b), end: Math.max(a, b) };   // never render 03:30-02:30
      })
      .filter(s => s.end > s.start)
      .sort((a, b) => a.start - b.start);
    const out = [];
    for (const s of list) {
      const prev = out[out.length - 1];
      if (prev && s.start <= prev.end) prev.end = Math.max(prev.end, s.end);
      else out.push({ ...s });
    }
    return out;
  }

  function sourcesHTML(sources) {
    const list = tidySources(sources);
    if (!list.length) return '';
    // NOTE: built as a single line — .chat__bubble uses white-space:pre-wrap,
    // so any newline/indent inside this markup would render as real whitespace
    // and blow the chips apart.
    const chips = list.map(s =>
      `<button class="chip chip--src" type="button" data-seek="${s.start}" title="Play from ${mmss(s.start)}">${mmss(s.start)}\u2013${mmss(s.end)}</button>`
    ).join('');
    return `<div class="chat__sources"><span class="chat__sources-label">${icon('clock', 12)} Sources</span>${chips}</div>`;
  }

  function bubble({ question, answer, sources, pending }) {
    const q = document.createElement('div');
    q.className = 'chat__row chat__row--me';
    q.innerHTML = `<div class="chat__bubble chat__bubble--me" dir="${dirOf(question)}">${escapeHtml(question)}</div>`;
    chatLog.append(q);

    const a = document.createElement('div');
    a.className = 'chat__row';
    const body = pending
      ? '<span class="chat__typing"><i></i><i></i><i></i></span>'
      : escapeHtml(answer) + sourcesHTML(sources);
    a.innerHTML = `<span class="chat__avatar">${icon('sparkle', 15)}</span>`
      + `<div class="chat__bubble" dir="${pending ? 'ltr' : dirOf(answer)}">${body}</div>`;
    chatLog.append(a);
    chatLog.scrollTop = chatLog.scrollHeight;
    return a;
  }

  const chatEmpty = () => `
    <div class="empty empty--sm">
      <div class="empty__icon">${icon('sparkle', 24)}</div>
      <p class="muted">Ask a question about this meeting.</p>
    </div>`;

  async function loadChatHistory() {
    try {
      const data = await api(`/meetings/${encodeURIComponent(meetingId)}/chat`, { cache: 'no-store' });
      const messages = Array.isArray(data?.messages) ? data.messages
                     : Array.isArray(data) ? data : [];
      chatLog.innerHTML = '';
      if (!messages.length) {
        chatLog.innerHTML = chatEmpty();
        $('#chatSuggest').hidden = false;
        return;
      }
      // API returns newest-first; render oldest-first like a chat log.
      [...messages]
        .sort((x, y) => new Date(x.created_at || 0) - new Date(y.created_at || 0))
        .forEach(m => bubble({ question: m.question, answer: m.answer, sources: m.sources }));
      chatLog.scrollTop = chatLog.scrollHeight;
    } catch (err) {
      if (err.status === 401) return;
      chatLog.innerHTML = `<p class="faint">${escapeHtml(err.message)}</p>`;
    }
  }

  async function askQuestion(question) {
    if (chatBusy || !question.trim()) return;
    chatBusy = true;
    $('#chatSuggest').hidden = true;
    $('.empty', chatLog)?.remove();

    const answerRow = bubble({ question, pending: true });
    chatInput.value = '';
    chatInput.style.height = 'auto';
    busy(chatSend, true);

    try {
      const res = await api(`/meetings/${encodeURIComponent(meetingId)}/chat`, {
        method: 'POST',
        body: { question },
      });
      const answer = res?.answer ?? '(no answer returned)';
      answerRow.innerHTML = `<span class="chat__avatar">${icon('sparkle', 15)}</span>`
        + `<div class="chat__bubble" dir="${dirOf(answer)}">${escapeHtml(answer)}${sourcesHTML(res?.sources)}</div>`;
    } catch (err) {
      if (err.status === 401) return;
      answerRow.innerHTML = `<span class="chat__avatar chat__avatar--err">${icon('alert', 15)}</span>`
        + `<div class="chat__bubble chat__bubble--err">${escapeHtml(err.message || 'Request failed')}</div>`;
    } finally {
      busy(chatSend, false);
      chatBusy = false;
      chatLog.scrollTop = chatLog.scrollHeight;
      chatInput.focus();
    }
  }

  chatForm.addEventListener('submit', e => { e.preventDefault(); askQuestion(chatInput.value); });

  // Enter sends, Shift+Enter newlines; textarea grows with content.
  chatInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); chatForm.requestSubmit(); }
  });
  chatInput.addEventListener('input', () => {
    chatInput.dir = dirOf(chatInput.value);
    chatInput.style.height = 'auto';
    chatInput.style.height = Math.min(chatInput.scrollHeight, 140) + 'px';
  });

  $('#chatSuggest').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (chip) askQuestion(chip.textContent.trim());
  });

  // Source chips seek the audio player.
  chatLog.addEventListener('click', e => {
    const chip = e.target.closest('[data-seek]');
    if (!chip) return;
    const audio = $('#audio');
    if (!audio || audio.classList.contains('hidden')) { toast('Audio is not available', 'info'); return; }
    audio.currentTime = Number(chip.dataset.seek) || 0;
    audio.play().catch(() => {});
    audio.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  let chatLoaded = false;
  $('#tab-chat').addEventListener('click', () => {
    if (chatLoaded) return;            // load once, on first open
    chatLoaded = true;
    loadChatHistory();
  });

  /* ---------- audio ---------- */
  (async () => {
    try {
      const res = await api(`/meetings/${encodeURIComponent(meetingId)}/audio`, { raw: true });
      const url = URL.createObjectURL(await res.blob());
      const audio = $('#audio');
      audio.src = url;
      audio.classList.remove('hidden');
      $('#audioStatus').classList.add('hidden');
    } catch (err) {
      if (err.status === 401) return;
      $('#audioStatus').textContent = 'Audio is not available for this meeting.';
    }
  })();

  /* ---------- delete ---------- */
  $('#deleteBtn').onclick = async () => {
    const ok = await confirmDialog({
      title: 'Delete this meeting?',
      body: 'The recording, transcript and summary will be permanently removed.',
      confirmText: 'Delete', danger: true,
    });
    if (!ok) return;
    busy($('#deleteBtn'), true);
    try {
      await api(`/meetings/${encodeURIComponent(meetingId)}`, { method: 'DELETE' });
      toast('Meeting deleted', 'ok');
      setTimeout(() => location.href = 'meetings.html', 600);
    } catch (err) {
      toast(err.message || 'Delete failed', 'error');
    } finally { busy($('#deleteBtn'), false); }
  };

  /* ---------- participants ---------- */
  $('#addParticipantBtn').onclick = () => {
    $('#participantBox').classList.toggle('hidden');
    if (!$('#participantBox').classList.contains('hidden')) $('#participantEmail').focus();
  };

  const results = $('#userResults');

  const search = async () => {
    const email = $('#participantEmail').value.trim();
    if (!email) return;
    busy($('#searchUserBtn'), true);
    results.innerHTML = '';
    try {
      const data = await api(`/users/search?email=${encodeURIComponent(email)}`);
      const users = Array.isArray(data) ? data : (data ? [data] : []);
      if (!users.length) {
        results.innerHTML = `<p class="faint">No user found with that email.</p>`;
        return;
      }
      users.forEach(u => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'user-result';
        btn.innerHTML = `
          <span class="avatar" style="width:34px;height:34px;font-size:.78rem">${escapeHtml(initials(u.name || u.email))}</span>
          <span class="grow" style="min-width:0">
            <span style="display:block;font-weight:600">${escapeHtml(u.name || 'Unnamed')}</span>
            <span class="faint mono" style="display:block;overflow:hidden;text-overflow:ellipsis">${escapeHtml(u.email || '')}</span>
          </span>
          ${icon('plus', 17)}`;
        btn.onclick = () => addUser(u.id, btn);
        results.append(btn);
      });
    } catch (err) {
      if (err.status !== 401) results.innerHTML = `<p class="faint">${escapeHtml(err.message)}</p>`;
    } finally { busy($('#searchUserBtn'), false); }
  };

  $('#searchUserBtn').onclick = search;
  $('#participantEmail').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); search(); } });

  async function addUser(userId, btn) {
    btn.disabled = true;
    try {
      await api(`/meetings/${encodeURIComponent(meetingId)}/participants?user_id=${encodeURIComponent(userId)}`,
                { method: 'POST' });
      toast('Participant added', 'ok');
      btn.innerHTML = `<span class="grow">Added</span>${icon('check', 17)}`;
      setTimeout(() => { $('#participantBox').classList.add('hidden'); results.innerHTML = ''; $('#participantEmail').value = ''; }, 900);
    } catch (err) {
      btn.disabled = false;
      toast(err.message || 'Could not add participant', 'error');
    }
  }
}
</script>
</body>
</html>
