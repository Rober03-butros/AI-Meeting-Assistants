<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Meeting · AI Meeting Assistant</title>
<link rel="stylesheet" href="assets/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='19'>🎙️</text></svg>">
</head>
<body>

<header class="appbar" id="appbar"></header>

<main class="page">
  <div class="container stack" style="gap:20px">

    <a class="faint row" href="meetings.html" style="gap:6px;width:max-content" id="backLink">Back to meetings</a>

    <div class="row row--between reveal" style="align-items:flex-start">
      <div class="grow">
        <h1 id="title" style="font-size:clamp(1.5rem,1.1rem+1.6vw,2.2rem)">
          <span class="skeleton skeleton--title" style="display:block"></span>
        </h1>
        <div class="row faint" style="gap:10px;margin-top:6px">
          <span id="date"></span>
          <span id="ownerBadge"></span>
        </div>
      </div>
      <div class="row">
        <button class="btn btn--sm hidden" id="addParticipantBtn" type="button">Add participant</button>
        <button class="btn btn--sm btn--danger hidden" id="deleteBtn" type="button">Delete</button>
      </div>
    </div>

    <div class="detail-grid">

      <section class="card reveal">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" id="tab-summary"    aria-selected="true"  data-panel="panel-summary">Summary</button>
          <button class="tab" role="tab" id="tab-transcript" aria-selected="false" data-panel="panel-transcript">Transcript</button>
        </div>

        <div id="panel-summary" role="tabpanel" aria-labelledby="tab-summary">
          <div class="prose" id="summary">
            <div class="skeleton skeleton--text"></div>
            <div class="skeleton skeleton--text" style="width:88%"></div>
            <div class="skeleton skeleton--text" style="width:72%"></div>
          </div>
          <div class="row" style="margin-top:14px">
            <button class="btn btn--sm btn--ghost" id="copySummary" type="button">Copy summary</button>
          </div>
        </div>

        <div id="panel-transcript" role="tabpanel" aria-labelledby="tab-transcript" hidden>
          <div class="prose" id="transcript"></div>

          <div class="transcribe-bar hidden" id="transcribeBar">
            <div class="grow">
              <div style="font-weight:650" id="transcribeTitle">Not transcribed yet</div>
              <div class="faint" id="transcribeHint">Run the speech-to-text model on this recording.</div>
            </div>
            <button class="btn btn--primary" id="transcribeBtn" type="button">Transcribe</button>
          </div>

          <div class="row" style="margin-top:14px">
            <button class="btn btn--sm btn--ghost" id="copyTranscript" type="button">Copy transcript</button>
            <button class="btn btn--sm btn--ghost" id="downloadTranscript" type="button">Download .txt</button>
          </div>
        </div>
      </section>

      <aside class="stack detail-grid__side reveal">
        <div class="panel stack">
          <div class="card__head" style="margin:0"><h3>Audio</h3></div>
          <audio id="audio" controls preload="none" class="hidden"></audio>
          <p class="faint" id="audioStatus">Loading audio…</p>
        </div>

        <div class="panel stack hidden" id="participantBox">
          <div class="card__head" style="margin:0"><h3>Add participant</h3></div>
          <div class="field">
            <label class="label sr-only" for="participantEmail">Search by email</label>
            <div class="row" style="gap:8px;flex-wrap:nowrap">
              <input class="input grow" id="participantEmail" type="email" placeholder="teammate@company.com">
              <button class="btn btn--icon btn--primary" id="searchUserBtn" type="button" aria-label="Search"></button>
            </div>
          </div>
          <div class="stack-sm" id="userResults"></div>
        </div>
      </aside>

    </div>
  </div>
</main>

<script type="module">
import { $, $$, api, icon, toast, busy, requireAuth, mountAppBar, confirmDialog,
         formatDate, relativeTime, escapeHtml, initials, Tokens, CONFIG } from './assets/js/app.js';

if (requireAuth()) {
  mountAppBar({ active: 'meetings' });

  const meetingId = new URLSearchParams(location.search).get('id');
  if (!meetingId) location.replace('meetings.html');

  $('#backLink').insertAdjacentHTML('afterbegin', icon('chevron', 15).replace('<svg', '<svg style="transform:rotate(180deg)"'));
  $('#deleteBtn').insertAdjacentHTML('afterbegin', icon('trash', 16));
  $('#addParticipantBtn').insertAdjacentHTML('afterbegin', icon('users', 16));
  $('#searchUserBtn').innerHTML = icon('search', 18);

  /* ---------- tabs ---------- */
  const tabs = $$('.tab');
  tabs.forEach(t => t.onclick = () => {
    tabs.forEach(o => {
      const on = o === t;
      o.setAttribute('aria-selected', on);
      $('#' + o.dataset.panel).hidden = !on;
    });
  });

  const copy = async (text, label) => {
    try { await navigator.clipboard.writeText(text); toast(`${label} copied`, 'ok', 1800); }
    catch { toast('Copy failed', 'error'); }
  };

  let meeting = null;
  let transcript = '';

  /* ---------- transcript state / gating ----------
     The Transcribe button is enabled ONLY when there is no transcript.
     Once one exists (or a run is in flight) it is permanently disabled. */
  const tBar   = $('#transcribeBar');
  const tBtn   = $('#transcribeBtn');
  const tTitle = $('#transcribeTitle');
  const tHint  = $('#transcribeHint');

  function renderTranscript(text) {
    transcript = (text || '').trim();
    const has = !!transcript;

    $('#transcript').innerHTML = has
      ? escapeHtml(transcript)
      : `<span class="muted">No transcript yet. Use the button below to generate one.</span>`;

    // Gate the action row
    $('#copyTranscript').disabled = !has;
    $('#downloadTranscript').disabled = !has;

    tBar.classList.remove('hidden');
    tBar.classList.toggle('is-done', has);
    tBtn.disabled = has;                       // <- the requested rule
    tBtn.setAttribute('aria-disabled', String(has));

    if (has) {
      tBtn.innerHTML = `${icon('check', 17)} Transcribed`;
      tBtn.title = 'This meeting already has a transcript';
      tTitle.textContent = 'Transcript ready';
      tHint.textContent = `${transcript.split(/\s+/).length.toLocaleString()} words.`;
    } else {
      tBtn.innerHTML = `${icon('sparkle', 17)} Transcribe`;
      tBtn.title = 'Run speech-to-text on this recording';
      tTitle.textContent = 'Not transcribed yet';
      tHint.textContent = 'Run the speech-to-text model on this recording.';
    }
  }

  /* ---------- run transcription (synchronous / long-running) ---------- */
  let running = false;

  const warnUnload = e => { e.preventDefault(); e.returnValue = ''; };

  tBtn.onclick = async () => {
    if (running || transcript) return;         // double-guard against double-submit
    running = true;

    busy(tBtn, true);
    tTitle.textContent = 'Transcribing…';
    tHint.textContent = 'The model is running on the server. Keep this tab open — this can take a few minutes.';
    tBar.classList.add('is-running');
    $('#transcript').innerHTML =
      `<div class="skeleton skeleton--text"></div>
       <div class="skeleton skeleton--text" style="width:92%"></div>
       <div class="skeleton skeleton--text" style="width:78%"></div>`;
    window.addEventListener('beforeunload', warnUnload);

    // The default fetch has no timeout; a long model run must not be cut off,
    // but we still bail out after 30 min rather than hanging forever.
    const ctrl = new AbortController();
    const timeout = setTimeout(() => ctrl.abort(), 30 * 60 * 1000);

    try {
      const res = await api(`/meetings/${encodeURIComponent(meetingId)}/transcribe`, {
        method: 'POST',
        signal: ctrl.signal,
      });

      // Accept whatever shape the backend returns.
      const text = typeof res === 'string' ? res
                 : res?.transcripts ?? res?.transcript ?? res?.text ?? '';

      if (text && String(text).trim()) {
        renderTranscript(String(text));
        toast('Transcript generated', 'ok');
      } else {
        // Job accepted but body empty — re-read the meeting to pick it up.
        const fresh = await api(`/meetings/${encodeURIComponent(meetingId)}`);
        const t = typeof fresh.transcripts === 'string' ? fresh.transcripts : fresh.transcript;
        if (t && t.trim()) { renderTranscript(t); toast('Transcript generated', 'ok'); }
        else { renderTranscript(''); toast('Finished, but no transcript was returned.', 'info', 6000); }
      }
    } catch (err) {
      if (err.status === 401) return;
      renderTranscript('');                    // re-enables the button so they can retry
      tTitle.textContent = 'Transcription failed';
      tHint.textContent = err.name === 'AbortError'
        ? 'Timed out after 30 minutes.'
        : (err.message || 'Something went wrong.');
      tBtn.innerHTML = `${icon('sparkle', 17)} Try again`;
      toast(err.name === 'AbortError' ? 'Transcription timed out' : (err.message || 'Transcription failed'), 'error', 6000);
    } finally {
      clearTimeout(timeout);
      window.removeEventListener('beforeunload', warnUnload);
      tBar.classList.remove('is-running');
      busy(tBtn, false);
      tBtn.disabled = !!transcript;            // busy() clears disabled — reapply the gate
      running = false;
    }
  };

  /* ---------- load meeting ---------- */
  (async () => {
    try {
      meeting = await api(`/meetings/${encodeURIComponent(meetingId)}`);

      const title = meeting.title || 'Untitled meeting';
      document.title = `${title} · AI Meeting Assistant`;
      $('#title').textContent = title;
      $('#date').innerHTML = `${icon('clock', 14)} ${escapeHtml(formatDate(meeting.created_at))} · ${escapeHtml(relativeTime(meeting.created_at) || '')}`;
      $('#date').style.display = 'inline-flex';
      $('#date').style.gap = '6px';
      $('#date').style.alignItems = 'center';

      const summary = (meeting.summary || '').trim();

      $('#summary').innerHTML = summary
        ? escapeHtml(summary)
        : `<span class="muted">No summary yet — it appears once processing finishes.</span>`;

      // Sets the text AND gates the Transcribe button off the current state.
      renderTranscript(typeof meeting.transcripts === 'string' ? meeting.transcripts
                                                               : meeting.transcript);

      $('#copySummary').disabled = !summary;
      $('#copySummary').onclick = () => copy(summary, 'Summary');
      $('#copyTranscript').onclick = () => copy(transcript, 'Transcript');
      $('#downloadTranscript').onclick = () => {
        const url = URL.createObjectURL(new Blob([transcript], { type: 'text/plain' }));
        const a = Object.assign(document.createElement('a'), { href: url, download: `${title}.txt` });
        a.click(); URL.revokeObjectURL(url);
      };

      if (meeting.is_owner) {
        $('#ownerBadge').outerHTML = `<span class="badge badge--brand">${icon('user', 13)} Owner</span>`;
        $('#addParticipantBtn').classList.remove('hidden');
        $('#deleteBtn').classList.remove('hidden');
      }
    } catch (err) {
      if (err.status === 401) return;
      $('#title').textContent = 'Meeting unavailable';
      $('#summary').innerHTML = `<span class="muted">${escapeHtml(err.message)}</span>`;
      toast(err.message || 'Could not load this meeting', 'error');
    }
  })();

  /* ---------- audio ---------- */
  (async () => {
    try {
      const res = await api(`/meetings/${encodeURIComponent(meetingId)}/audio`, { raw: true });
      const url = URL.createObjectURL(await res.blob());
      const audio = $('#audio');
      audio.src = url;
      audio.classList.remove('hidden');
      $('#audioStatus').classList.add('hidden');
    } catch (err) {
      if (err.status === 401) return;
      $('#audioStatus').textContent = 'Audio is not available for this meeting.';
    }
  })();

  /* ---------- delete ---------- */
  $('#deleteBtn').onclick = async () => {
    const ok = await confirmDialog({
      title: 'Delete this meeting?',
      body: 'The recording, transcript and summary will be permanently removed.',
      confirmText: 'Delete', danger: true,
    });
    if (!ok) return;
    busy($('#deleteBtn'), true);
    try {
      await api(`/meetings/${encodeURIComponent(meetingId)}`, { method: 'DELETE' });
      toast('Meeting deleted', 'ok');
      setTimeout(() => location.href = 'meetings.html', 600);
    } catch (err) {
      toast(err.message || 'Delete failed', 'error');
    } finally { busy($('#deleteBtn'), false); }
  };

  /* ---------- participants ---------- */
  $('#addParticipantBtn').onclick = () => {
    $('#participantBox').classList.toggle('hidden');
    if (!$('#participantBox').classList.contains('hidden')) $('#participantEmail').focus();
  };

  const results = $('#userResults');

  const search = async () => {
    const email = $('#participantEmail').value.trim();
    if (!email) return;
    busy($('#searchUserBtn'), true);
    results.innerHTML = '';
    try {
      const data = await api(`/users/search?email=${encodeURIComponent(email)}`);
      const users = Array.isArray(data) ? data : (data ? [data] : []);
      if (!users.length) {
        results.innerHTML = `<p class="faint">No user found with that email.</p>`;
        return;
      }
      users.forEach(u => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'user-result';
        btn.innerHTML = `
          <span class="avatar" style="width:34px;height:34px;font-size:.78rem">${escapeHtml(initials(u.name || u.email))}</span>
          <span class="grow" style="min-width:0">
            <span style="display:block;font-weight:600">${escapeHtml(u.name || 'Unnamed')}</span>
            <span class="faint mono" style="display:block;overflow:hidden;text-overflow:ellipsis">${escapeHtml(u.email || '')}</span>
          </span>
          ${icon('plus', 17)}`;
        btn.onclick = () => addUser(u.id, btn);
        results.append(btn);
      });
    } catch (err) {
      if (err.status !== 401) results.innerHTML = `<p class="faint">${escapeHtml(err.message)}</p>`;
    } finally { busy($('#searchUserBtn'), false); }
  };

  $('#searchUserBtn').onclick = search;
  $('#participantEmail').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); search(); } });

  async function addUser(userId, btn) {
    btn.disabled = true;
    try {
      await api(`/meetings/${encodeURIComponent(meetingId)}/participants?user_id=${encodeURIComponent(userId)}`,
                { method: 'POST' });
      toast('Participant added', 'ok');
      btn.innerHTML = `<span class="grow">Added</span>${icon('check', 17)}`;
      setTimeout(() => { $('#participantBox').classList.add('hidden'); results.innerHTML = ''; $('#participantEmail').value = ''; }, 900);
    } catch (err) {
      btn.disabled = false;
      toast(err.message || 'Could not add participant', 'error');
    }
  }
}
</script>
</body>
</html>
