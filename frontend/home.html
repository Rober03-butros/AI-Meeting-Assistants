<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Home · AI Meeting Assistant</title>
<link rel="stylesheet" href="assets/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='19'>🎙️</text></svg>">
</head>
<body>

<header class="appbar" id="appbar"></header>

<main class="page">
  <div class="container stack" style="gap:28px">

    <section class="hero reveal">
      <span class="hero__eyebrow" id="greeting">Welcome back</span>
      <h1>Turn every meeting into <span class="accent">clear, shareable notes.</span></h1>
      <p class="muted" style="max-width:60ch">
        Record your calls, get an automatic transcript and an AI summary, then share it with your team.
      </p>
    </section>

    <section class="row reveal" style="gap:14px">
      <div class="row" style="gap:12px">
        <span class="avatar avatar--lg" id="avatar">·</span>
        <div>
          <div style="font-weight:700" id="userName">
            <span class="skeleton skeleton--text" style="display:block;width:140px"></span>
          </div>
          <div class="faint mono" id="userEmail"></div>
        </div>
      </div>
    </section>

    <section class="stats reveal" id="stats" aria-label="Overview">
      <div class="stat"><div class="stat__num" id="statTotal">—</div><div class="stat__label">Meetings</div></div>
      <div class="stat"><div class="stat__num" id="statSummarised">—</div><div class="stat__label">Summarised</div></div>
      <div class="stat"><div class="stat__num" id="statRecent">—</div><div class="stat__label">Last 7 days</div></div>
    </section>

    <section class="tiles reveal">
      <button class="tile" data-go="recorder.html">
        <span class="tile__icon" data-icon="mic"></span>
        <h3>Start a recording</h3>
        <p>Capture screen &amp; microphone audio, then upload it for transcription.</p>
      </button>
      <button class="tile" data-go="meetings.html">
        <span class="tile__icon" data-icon="list"></span>
        <h3>My meetings</h3>
        <p>Browse past meetings with transcripts, summaries and audio playback.</p>
      </button>
      <button class="tile" id="meetTile">
        <span class="tile__icon" data-icon="video"></span>
        <h3>Open Google Meet</h3>
        <p>Launch a call in a new window and record it side by side.</p>
      </button>
    </section>

    <section class="card reveal">
      <div class="card__head">
        <span class="tile__icon" data-icon="clock" style="width:38px;height:38px;margin:0"></span>
        <h3>Recent meetings</h3>
        <a class="btn btn--sm btn--ghost" href="meetings.html">View all</a>
      </div>
      <div class="meeting-list" id="recent">
        <div class="skeleton skeleton--card"></div>
        <div class="skeleton skeleton--card"></div>
      </div>
    </section>

  </div>
</main>

<script type="module">
import { $, $$, api, icon, toast, requireAuth, mountAppBar, initials,
         relativeTime, escapeHtml } from './assets/js/app.js';

if (requireAuth()) {
  mountAppBar({ active: 'home' });

  $$('[data-icon]').forEach(n => n.innerHTML = icon(n.dataset.icon, 21));
  $$('[data-go]').forEach(n => n.onclick = () => location.href = n.dataset.go);
  $('#meetTile').onclick = () => window.open('https://meet.google.com', '_blank', 'noopener,width=1200,height=800');

  const hour = new Date().getHours();
  const part = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';

  (async () => {
    try {
      const user = await api('/auth/me');
      $('#greeting').textContent = `${part}, ${user.name?.split(' ')[0] || 'there'}`;
      $('#userName').textContent = user.name || 'Your account';
      $('#userEmail').textContent = user.email || '';
      $('#avatar').textContent = initials(user.name || user.email);
    } catch (err) {
      if (err.status !== 401) toast(err.message, 'error');
      $('#userName').textContent = 'Your account';
    }
  })();

  (async () => {
    const host = $('#recent');
    try {
      const meetings = await api('/meetings');
      const list = Array.isArray(meetings) ? meetings : (meetings?.items || []);

      $('#statTotal').textContent = list.length;
      $('#statSummarised').textContent = list.filter(m => m.summary).length;
      const week = Date.now() - 7 * 864e5;
      $('#statRecent').textContent = list.filter(m => new Date(m.created_at) >= week).length;

      const recent = [...list]
        .sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0))
        .slice(0, 4);

      if (!recent.length) {
        host.innerHTML = `<div class="empty">
          <div class="empty__icon">${icon('inbox', 28)}</div>
          <h3>No meetings yet</h3>
          <p class="muted">Record your first meeting to see it here.</p>
          <a class="btn btn--primary" href="recorder.html">${icon('mic', 17)} Start recording</a>
        </div>`;
        return;
      }

      host.innerHTML = recent.map(m => `
        <a class="meeting-card" href="meeting.html?id=${encodeURIComponent(m.id)}">
          <span class="meeting-card__icon">${icon('doc', 20)}</span>
          <span class="grow">
            <span class="meeting-card__title" style="display:block">${escapeHtml(m.title || 'Untitled meeting')}</span>
            <span class="meeting-card__meta">${escapeHtml(relativeTime(m.created_at) || '')}</span>
          </span>
          <span class="meeting-card__chev">${icon('chevron', 18)}</span>
        </a>`).join('');
    } catch (err) {
      if (err.status === 401) return;
      host.innerHTML = `<div class="empty">
        <div class="empty__icon">${icon('alert', 28)}</div>
        <h3>Couldn't load meetings</h3>
        <p class="muted">${escapeHtml(err.message)}</p>
      </div>`;
    }
  })();
}
</script>
</body>
</html>
