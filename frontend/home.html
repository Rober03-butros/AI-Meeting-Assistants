<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Home · AI Meeting Assistant</title>
<link rel="stylesheet" href="assets/css/app.css?v=30">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='19'>🎙️</text></svg>">
</head>
<body>

<header class="appbar" id="appbar"></header>

<main class="page">
  <div class="container stack" style="gap:28px">

    <section class="hero reveal">
      <span class="hero__eyebrow" id="greeting">Welcome back</span>
      <h1>Turn every meeting into <span class="accent">clear, shareable notes.</span></h1>
      <p class="muted" style="max-width:60ch">
        Record your calls, get an automatic transcript and an AI summary, then share it with your team.
      </p>
    </section>

    <section class="row reveal" style="gap:14px">
      <div class="row" style="gap:12px">
        <span class="avatar avatar--lg" id="avatar">·</span>
        <div>
          <div style="font-weight:700" id="userName">
            <span class="skeleton skeleton--text" style="display:block;width:140px"></span>
          </div>
          <div class="faint mono" id="userEmail"></div>
        </div>
      </div>
    </section>

    <section class="stats reveal" id="stats" aria-label="Overview">
      <div class="stat"><div class="stat__num" id="statTotal">—</div><div class="stat__label">Meetings</div></div>
      <div class="stat"><div class="stat__num" id="statSummarised">—</div><div class="stat__label">Summarised</div></div>
      <div class="stat"><div class="stat__num" id="statRecent">—</div><div class="stat__label">Last 7 days</div></div>
    </section>

    <section class="tiles reveal">
      <button class="tile" data-go="recorder.html">
        <span class="tile__icon" data-icon="mic"></span>
        <h3>Start a recording</h3>
        <p>Capture screen &amp; microphone audio, then upload it for transcription.</p>
      </button>
      <button class="tile" data-go="meetings.html">
        <span class="tile__icon" data-icon="list"></span>
        <h3>My meetings</h3>
        <p>Browse past meetings with transcripts, summaries and audio playback.</p>
      </button>
      <button class="tile" id="meetTile">
        <span class="tile__icon" data-icon="video"></span>
        <h3>Open Google Meet</h3>
        <p>Launch a call in a new window and record it side by side.</p>
      </button>
    </section>

    <section class="panels">

      <!-- PANEL 1: live on the server -->
      <div class="card panel-col" id="activeCard">
        <div class="card__head">
          <span class="tile__icon tile__icon--live" data-icon="sparkle" style="width:38px;height:38px;margin:0"></span>
          <h3>Processing now</h3>
          <span class="badge badge--live" id="activeCount"><span class="dot dot--pulse"></span> 0</span>
          <button class="btn btn--icon btn--ghost" id="muteBtn" type="button"
                  title="Mute completion sound" aria-label="Mute completion sound"></button>
        </div>
        <div class="meeting-list" id="activeList">
          <div class="skeleton skeleton--card"></div>
        </div>
      </div>

      <!-- PANEL 2: needs action -->
      <div class="card panel-col" id="todoCard">
        <div class="card__head">
          <span class="tile__icon tile__icon--warn" data-icon="alert" style="width:38px;height:38px;margin:0"></span>
          <h3>Needs your attention</h3>
          <span class="badge" id="todoCount">0</span>
        </div>
        <div class="meeting-list" id="todoList">
          <div class="skeleton skeleton--card"></div>
        </div>
      </div>

    </section>

  </div>
</main>

<!-- Surface module-load / runtime failures instead of showing a blank page. -->
<script>
window.__bootError = function (msg) {
  var host = document.getElementById('todoList') || document.body;
  host.innerHTML =
    '<div class="empty"><div class="empty__icon">!</div>' +
    '<h3>Page script failed to load</h3>' +
    '<p class="muted" style="max-width:60ch;word-break:break-word">' +
    String(msg).replace(/[<>&]/g, '') + '</p>' +
    '<p class="faint">Open DevTools → Console for the full stack trace.</p></div>';
};
window.addEventListener('error', function (e) {
  if (e.message) window.__bootError(e.message);
});
window.addEventListener('unhandledrejection', function (e) {
  window.__bootError((e.reason && e.reason.message) || e.reason || 'Unhandled promise rejection');
});
</script>

<script type="module">
import { $, $$, api, icon, toast, requireAuth, mountAppBar, initials,
         relativeTime, escapeHtml, transcriptionStatus, TSTATUS, hasTranscript,
         hasSummary, chime, enableChime, notifyDesktop, requestNotifyPermission, Notes,
         JOB, jobRunning, SEG_API, segmentCounts } from './assets/js/app.js?v=30';

if (requireAuth()) {
  mountAppBar({ active: 'home' });

  $$('[data-icon]').forEach(n => n.innerHTML = icon(n.dataset.icon, 21));
  $$('[data-go]').forEach(n => n.onclick = () => location.href = n.dataset.go);
  $('#meetTile').onclick = () => window.open('https://meet.google.com', '_blank', 'noopener,width=1200,height=800');

  const hour = new Date().getHours();
  const part = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';

  (async () => {
    try {
      const user = await api('/auth/me');
      $('#greeting').textContent = `${part}, ${user.name?.split(' ')[0] || 'there'}`;
      $('#userName').textContent = user.name || 'Your account';
      $('#userEmail').textContent = user.email || '';
      $('#avatar').textContent = initials(user.name || user.email);
    } catch (err) {
      if (err.status !== 401) toast(err.message, 'error');
      $('#userName').textContent = 'Your account';
    }
  })();


  enableChime();
  requestNotifyPermission();

  const card = (m, { meta = '', trailing = '', cls = '' } = {}) => `
    <a class="meeting-card ${cls}" href="meeting.html?id=${encodeURIComponent(m.id)}">
      <span class="meeting-card__icon">${icon('doc', 20)}</span>
      <span class="grow">
        <span class="meeting-card__title" style="display:block">${escapeHtml(m.title || 'Untitled meeting')}</span>
        <span class="meeting-card__meta">${meta}</span>
      </span>
      ${trailing}
      <span class="meeting-card__chev">${icon('chevron', 18)}</span>
    </a>`;


  const hydrated = new Map(); 
  const detail   = new Map();
  let hydrating = false;


  const watcherSawFinish = id => {
    try {
      const seen = JSON.parse(localStorage.getItem('watch_seen') || '{}');
      return seen[String(id)] === 'done' || seen[String(id)] === 'failed';
    } catch { return false; }
  };

  const enrich = m => {
    const d = detail.get(String(m.id));
    if (!d) return m;
    const listSt = transcriptionStatus(m);
    if (listSt === TSTATUS.DONE || listSt === TSTATUS.FAILED || hasTranscript(m)) {
      detail.delete(String(m.id)); 
      return m;
    }
    return { ...m, ...d };
  };


  const segState = new Map(); 
  let probing = false;

  async function probeSegments(list) {
    if (probing) return;
    const targets = list.filter(m => {
      const id = String(m.id);
      if (segState.has(id)) return false;
      if (jobRunning(JOB.SEGMENT, id) || jobRunning(JOB.SUMMARIZE, id)) return false;
      const st = transcriptionStatus(m);
      if (st === TSTATUS.PROCESSING || st === TSTATUS.FAILED) return false;
      return hasTranscript(m) || st === TSTATUS.DONE || hydrated.get(id) === true;
    }).slice(0, 8);

    if (!targets.length) return;
    probing = true;
    try {
      const results = await Promise.all(targets.map(async m => {
        try {
          const res = await api(SEG_API.listAll(m.id), { cache: 'no-store' });
          return [String(m.id), segmentCounts(res)];
        } catch (err) {
          if (err.status === 404) return [String(m.id), { total: 0, summarised: 0 }];
          return null;
        }
      }));
      let changed = false;
      for (const r of results) { if (r) { segState.set(r[0], r[1]); changed = true; } }
      if (changed && lastList) paint(lastList);
    } finally { probing = false; }
  }

  function forgetSegState(id) { segState.delete(String(id)); }

  async function hydrateUnknowns(list) {
    if (hydrating) return;

    const suspects = list.filter(m => {
      const id = String(m.id);
      const st = transcriptionStatus(enrich(m));
      if (st === TSTATUS.FAILED) return false;
      if (st === TSTATUS.PROCESSING) return true;
      if (hasTranscript(m) || st === TSTATUS.DONE) return false;
      if (hydrated.get(id) === false && watcherSawFinish(id)) return true;
      return !hydrated.has(id);
    }).slice(0, 12);

    if (!suspects.length) return;
    hydrating = true;
    try {
      const checked = await Promise.all(suspects.map(async m => {
        try {
          const full = await api(`/meetings/${encodeURIComponent(m.id)}`, { cache: 'no-store' });
          return [String(m.id), hasTranscript(full) || transcriptionStatus(full) === TSTATUS.DONE, full];
        } catch { return [String(m.id), null, null]; }
      }));

      let changed = false;
      for (const [id, ok, full] of checked) {
        if (ok === null) continue;
        hydrated.set(id, ok);
        if (full) {
          detail.set(id, full);
          changed = true;
        }
      }
      if (changed) renderAll(list);
    } finally { hydrating = false; }
  }


  let prevProcessing = new Set();
  let firstRun = true;
  let pollDelay = 4000;

  const muteBtn = $('#muteBtn');
  const paintMute = () => {
    if (!muteBtn) return;
    const muted = localStorage.getItem('mute_sounds') === '1';
    muteBtn.innerHTML = icon(muted ? 'alert' : 'checkCirc', 17);
    muteBtn.title = muted ? 'Completion sound is off' : 'Completion sound is on';
    muteBtn.style.color = muted ? 'var(--text-faint)' : 'var(--brand)';
  };
  if (muteBtn) {
    muteBtn.onclick = e => {
      e.preventDefault();
      const muted = localStorage.getItem('mute_sounds') === '1';
      localStorage.setItem('mute_sounds', muted ? '0' : '1');
      paintMute();
      if (muted) chime('success');
    };
  }
  paintMute();

  function renderAll(rawList) {

    const list = rawList.map(enrich);
    $('#statTotal').textContent = list.length;
    $('#statSummarised').textContent = list.filter(hasSummary).length;
    const week = Date.now() - 7 * 864e5;
    $('#statRecent').textContent = list.filter(m => new Date(m.created_at) >= week).length;

    const startedHere = m => {
      try {
        const t = Number(localStorage.getItem(`transcribing:${m.id}`));
        if (!t) return false;
        if (Date.now() - t > 60 * 60 * 1000) {
          localStorage.removeItem(`transcribing:${m.id}`);
          return false;
        }
        return true;
      } catch { return false; }
    };

    const isProcessing = m => {
      const st = transcriptionStatus(m);
      if (st === TSTATUS.PROCESSING) return true;
      if (st === TSTATUS.DONE || st === TSTATUS.FAILED) {
        try { localStorage.removeItem(`transcribing:${m.id}`); } catch {}
        return false;
      }
      return startedHere(m);
    };

    const jobKind = m => jobRunning(JOB.SEGMENT, m.id) ? 'Segmenting'
                       : jobRunning(JOB.SUMMARIZE, m.id) ? 'Summarising'
                       : null;

    const processing = list.filter(m => isProcessing(m) || jobKind(m));
    const failed     = list.filter(m => transcriptionStatus(m) === TSTATUS.FAILED);

    const isTranscribed = m => hasTranscript(m) || transcriptionStatus(m) === TSTATUS.DONE;

    const summariesInUse = list.some(hasSummary);

    const nextAction = m => {
      const id = String(m.id);
      const st = transcriptionStatus(m);
      if (isProcessing(m) || jobKind(m)) return null;
      if (st === TSTATUS.FAILED) return 'retry';
      if (!isTranscribed(m)) return 'transcribe';

      const seg = segState.get(id);
      if (!seg) return null;
      if (seg.total === 0) return 'segment';
      if (seg.summarised < seg.total) return 'summarise';
      return null;
    };

    const needsWork = list.filter(m => {
      const a = nextAction(m);
      return a === 'transcribe' || a === 'segment' || a === 'summarise';
    });

    firstRun = false;

    $('#activeCount').innerHTML = `<span class="dot dot--pulse"></span> ${processing.length}`;
    $('#activeList').innerHTML = processing.length
      ? processing.map(m => card(m, {
          cls: 'is-processing',
          meta: `Started ${escapeHtml(relativeTime(m.created_at) || 'recently')}`,
          trailing: `<span class="badge badge--live"><span class="dot dot--pulse"></span> ${jobKind(m) || 'Transcribing'}</span>`,
        })).join('')
      : `<div class="empty empty--sm">
           <div class="empty__icon">${icon('checkCirc', 24)}</div>
           <p class="muted">Nothing is processing right now.</p>
         </div>`;

    const todo = [...failed, ...needsWork];
    $('#todoCount').textContent = todo.length;
    $('#todoList').innerHTML = todo.length
      ? todo.slice(0, 8).map(m => {
          const seg = segState.get(String(m.id));
          const a = transcriptionStatus(m) === TSTATUS.FAILED ? 'retry' : nextAction(m);
          let tag, meta;
          if (a === 'retry') {
            tag = `<span class="badge" style="color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent)">${icon('alert', 13)} Retry</span>`;
            meta = 'Last attempt failed';
          } else if (a === 'transcribe') {
            tag = `<span class="badge badge--warn">${icon('mic', 13)} Transcribe</span>`;
            meta = 'No transcript yet';
          } else if (a === 'segment') {
            tag = `<span class="badge badge--warn">${icon('list', 13)} Segment</span>`;
            meta = 'Transcript ready — not split into topics';
          } else {
            tag = `<span class="badge badge--warn">${icon('sparkle', 13)} Summarise</span>`;
            meta = seg ? `${seg.summarised} of ${seg.total} topics summarised`
                       : 'Topics not summarised';
          }
          return card(m, { meta: escapeHtml(meta), trailing: tag });
        }).join('')
      : `<div class="empty empty--sm">
           <div class="empty__icon">${icon('checkCirc', 24)}</div>
           <p class="muted">${list.length ? 'All meetings are processed. Nice.' : 'No meetings yet.'}</p>
           ${list.length ? '' : `<a class="btn btn--sm btn--primary" href="recorder.html">${icon('mic', 15)} Record one</a>`}
         </div>`;
  }


  let lastList = null;
  function paint(list) {
    lastList = list;
    if (firstRun && list.length) {
      console.info('[home] /meetings row keys:', Object.keys(list[0]).join(', '));
    }
    try {
      renderAll(list);
      hydrateUnknowns(list);
      probeSegments(list);
    } catch (renderErr) {
      console.error('renderAll failed:', renderErr);
      $('#todoList').innerHTML = `<div class="empty empty--sm">
        <div class="empty__icon">${icon('alert', 28)}</div>
        <h3>Could not render meetings</h3>
        <p class="muted">${escapeHtml(renderErr.message)}</p>
      </div>`;
    }
  }

  window.addEventListener('jobs:changed', e => {
    if (e.detail && e.detail.running === false) forgetSegState(e.detail.id);
    if (lastList) { paint(lastList); probeSegments(lastList); }
  });
  window.addEventListener('meetings:refreshed', e => {

    const finished = e.detail.finished || [];
    for (const id of finished) {
      hydrated.delete(String(id));
      detail.delete(String(id));
      forgetSegState(id); 
    }
    const list = e.detail.list || [];
    paint(list);
    if (finished.length) probeSegments(list);
  });

  (async () => {
    try {
      const data = await api('/meetings', { cache: 'no-store' });
      paint(Array.isArray(data) ? data
          : Array.isArray(data?.items) ? data.items
          : Array.isArray(data?.results) ? data.results
          : Array.isArray(data?.meetings) ? data.meetings : []);
    } catch (err) {
      if (err.status === 401) return;
      $('#todoList').innerHTML = `<div class="empty empty--sm">
        <div class="empty__icon">${icon('alert', 28)}</div>
        <h3>Couldn't load meetings</h3>
        <p class="muted">${escapeHtml(err.message)}</p>
      </div>`;
    }
  })();

}
</script>
</body>
</html>
